<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94ec00"/>
      <stop offset="100%" stop-color="#78c500"/>
    </linearGradient>
  </defs>
  <rect width="600" height="900" rx="20" fill="url(#bgGrad)"/>
  
  <rect x="0" y="0" width="600" height="110" rx="20" fill="#182234"/>
  <rect x="0" y="106" width="600" height="4" fill="url(#accentGrad)"/>
  <text x="300" y="55" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" text-anchor="middle" letter-spacing="1">TABLA DE JUGADORES</text>
  <text x="300" y="85" fill="#94ec00" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">CAFÚ INDUMENTARIA DEPORTIVA</text>
  
  <rect x="40" y="140" width="520" height="230" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <circle cx="80" cy="180" r="22" fill="#94ec00"/>
  <text x="80" y="187" fill="#000000" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" text-anchor="middle">✔</text>
  <text x="120" y="185" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Cómo llenar la tabla</text>
  <text x="60" y="230" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="15">
    <tspan x="60" dy="0">1. Escribe el Nombre de cada jugador (opcional u obligatorio según desees).</tspan>
    <tspan x="60" dy="24">2. Selecciona la Talla obligatoria para cada prenda.</tspan>
    <tspan x="60" dy="24">3. Marca los Adicionales correspondientes con las casillas verdes.</tspan>
    <tspan x="60" dy="24">4. Revisa los contadores superiores para que coincidan con el total.</tspan>
  </text>

  <rect x="40" y="400" width="520" height="340" rx="14" fill="#182234" stroke="#334155" stroke-width="2"/>
  <text x="300" y="440" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Asignación inteligente de adicionales</text>

  <rect x="70" y="470" width="460" height="70" rx="10" fill="#0f172a" stroke="#94ec00" stroke-width="1.5"/>
  <text x="100" y="512" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">Contador en vivo:</text>
  <rect x="250" y="485" width="130" height="38" rx="19" fill="#1e293b" stroke="#334155"/>
  <text x="315" y="509" fill="#94ec00" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle">Manga larga 1/2</text>
  <rect x="390" y="485" width="125" height="38" rx="19" fill="#1e293b" stroke="#334155"/>
  <text x="452" y="509" fill="#94ec00" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle">Cuello polo 2/2 ✓</text>

  <rect x="70" y="565" width="460" height="135" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="100" y="605" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="18">⚠️</text>
  <text x="130" y="603" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">Límite de adicionales</text>
  <text x="100" y="635" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="14">
    <tspan x="100" dy="0">No puedes asignar más adicionales de los comprados en el Paso 1.</tspan>
    <tspan x="100" dy="22">Si necesitas cambiar a quién se lo asignas, desmarca la casilla</tspan>
    <tspan x="100" dy="22">de un jugador y márcala en el otro.</tspan>
  </text>

  <text x="300" y="860" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">(Imagen de referencia reemplazable en assets/images/help-tabla.svg)</text>
</svg>
