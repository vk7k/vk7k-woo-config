<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94ec00"/>
      <stop offset="100%" stop-color="#78c500"/>
    </linearGradient>
  </defs>
  <rect width="600" height="900" rx="20" fill="url(#bgGrad)"/>
  
  <rect x="0" y="0" width="600" height="110" rx="20" fill="#182234"/>
  <rect x="0" y="106" width="600" height="4" fill="url(#accentGrad)"/>
  <text x="300" y="55" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" text-anchor="middle" letter-spacing="1">JUGADORES Y TALLAS</text>
  <text x="300" y="85" fill="#94ec00" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">CAFÚ INDUMENTARIA DEPORTIVA</text>
  
  <rect x="40" y="140" width="520" height="230" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <circle cx="80" cy="180" r="22" fill="#94ec00"/>
  <text x="80" y="187" fill="#000000" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" text-anchor="middle">📋</text>
  <text x="120" y="185" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Opciones para ingresar datos</text>
  <text x="60" y="230" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="15">
    <tspan x="60" dy="0">Tienes dos formas fáciles y rápidas para ingresar los datos:</tspan>
    <tspan x="60" dy="24">• Opción A: Sube una planilla Excel, PDF, foto o nota con</tspan>
    <tspan x="60" dy="24">  la lista de nombres, tallas y dorsales de tu equipo.</tspan>
    <tspan x="60" dy="24">• Opción B: Haz clic en "Usar tabla (opcional)" para escribir</tspan>
    <tspan x="60" dy="24">  directamente en pantalla cada jugador.</tspan>
  </text>

  <rect x="40" y="400" width="520" height="330" rx="14" fill="#182234" stroke="#334155" stroke-width="2"/>
  <text x="300" y="440" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Ejemplo de archivo de lista</text>

  <!-- Mockup table in document -->
  <rect x="70" y="470" width="460" height="220" rx="10" fill="#0f172a" stroke="#334155"/>
  <rect x="70" y="470" width="460" height="40" rx="10" fill="#1e293b"/>
  <text x="100" y="496" fill="#94ec00" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">N°</text>
  <text x="160" y="496" fill="#94ec00" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">NOMBRE</text>
  <text x="310" y="496" fill="#94ec00" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">TALLA</text>
  <text x="400" y="496" fill="#94ec00" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">DETALLES</text>

  <text x="100" y="535" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14">#1</text>
  <text x="160" y="535" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14">MATÍAS</text>
  <text x="310" y="535" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14">M</text>
  <text x="400" y="535" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Manga Larga</text>

  <line x1="70" y1="550" x2="530" y2="550" stroke="#334155" stroke-width="1"/>

  <text x="100" y="585" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14">#2</text>
  <text x="160" y="585" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14">CRISTIAN</text>
  <text x="310" y="585" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14">L</text>
  <text x="400" y="585" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Cuello Piqué</text>

  <line x1="70" y1="600" x2="530" y2="600" stroke="#334155" stroke-width="1"/>

  <text x="100" y="635" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14">#3</text>
  <text x="160" y="635" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14">GONZALO</text>
  <text x="310" y="635" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14">XL</text>
  <text x="400" y="635" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Estándar</text>

  <text x="300" y="860" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">(Imagen de referencia reemplazable en assets/images/help-jugadores.svg)</text>
</svg>
