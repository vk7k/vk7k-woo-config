<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94ec00"/>
      <stop offset="100%" stop-color="#78c500"/>
    </linearGradient>
  </defs>
  <rect width="600" height="900" rx="20" fill="url(#bgGrad)"/>
  
  <!-- Header Bar -->
  <rect x="0" y="0" width="600" height="110" rx="20" fill="#182234"/>
  <rect x="0" y="106" width="600" height="4" fill="url(#accentGrad)"/>
  <text x="300" y="55" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" text-anchor="middle" letter-spacing="1">GUÍA DE CANTIDADES</text>
  <text x="300" y="85" fill="#94ec00" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">CAFÚ INDUMENTARIA DEPORTIVA</text>
  
  <!-- Step 1 Card -->
  <rect x="40" y="140" width="520" height="210" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <circle cx="80" cy="180" r="22" fill="#94ec00"/>
  <text x="80" y="187" fill="#000000" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" text-anchor="middle">1</text>
  <text x="120" y="185" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">Total de productos o sets</text>
  <text x="60" y="230" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="15" width="480">
    <tspan x="60" dy="0">Indica el número total de prendas que componen tu pedido.</tspan>
    <tspan x="60" dy="24">Puedes usar los botones [+] y [-] o escribir la cantidad</tspan>
    <tspan x="60" dy="24">directamente en el campo numérico.</tspan>
  </text>
  <rect x="60" y="285" width="480" height="45" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="300" y="313" fill="#94ec00" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">💡 El pedido mínimo de confección es de 1 prenda</text>

  <!-- Illustration Box -->
  <rect x="40" y="380" width="520" height="340" rx="14" fill="#182234" stroke="#334155" stroke-width="2"/>
  <text x="300" y="420" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Ejemplo de configuración de prendas</text>
  
  <!-- Diagram inside -->
  <rect x="80" y="450" width="440" height="70" rx="10" fill="#0f172a" stroke="#94ec00" stroke-width="1.5"/>
  <text x="110" y="492" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">Set Completo Fútbol</text>
  <rect x="360" y="465" width="40" height="40" rx="6" fill="#334155"/>
  <text x="380" y="490" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" text-anchor="middle">-</text>
  <rect x="405" y="465" width="55" height="40" rx="6" fill="#1e293b" stroke="#64748b"/>
  <text x="432" y="490" fill="#94ec00" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" text-anchor="middle">10</text>
  <rect x="465" y="465" width="40" height="40" rx="6" fill="#94ec00"/>
  <text x="485" y="490" fill="#000000" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" text-anchor="middle">+</text>

  <text x="300" y="555" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle">
    <tspan x="300" dy="0">El total se calculará de forma automática con IVA incluido.</tspan>
    <tspan x="300" dy="22">En los siguientes pasos podrás ingresar el diseño y tallas.</tspan>
  </text>
  
  <!-- Info badge -->
  <rect x="80" y="605" width="440" height="85" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="105" y="640" fill="#94ec00" font-family="system-ui, -apple-system, sans-serif" font-size="20">✓</text>
  <text x="135" y="638" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Abono Inicial del 50% disponible</text>
  <text x="135" y="662" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Paga la mitad al ordenar y el saldo cuando tu pedido esté listo.</text>

  <!-- Footer placeholder notice -->
  <text x="300" y="860" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">(Imagen de referencia reemplazable en assets/images/help-cantidades.svg)</text>
</svg>
