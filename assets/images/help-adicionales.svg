<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94ec00"/>
      <stop offset="100%" stop-color="#78c500"/>
    </linearGradient>
  </defs>
  <rect width="600" height="900" rx="20" fill="url(#bgGrad)"/>
  
  <rect x="0" y="0" width="600" height="110" rx="20" fill="#182234"/>
  <rect x="0" y="106" width="600" height="4" fill="url(#accentGrad)"/>
  <text x="300" y="55" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" text-anchor="middle" letter-spacing="1">GUÍA DE ADICIONALES</text>
  <text x="300" y="85" fill="#94ec00" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">CAFÚ INDUMENTARIA DEPORTIVA</text>
  
  <rect x="40" y="140" width="520" height="230" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <circle cx="80" cy="180" r="22" fill="#94ec00"/>
  <text x="80" y="187" fill="#000000" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" text-anchor="middle">+</text>
  <text x="120" y="185" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700">¿Qué son los adicionales?</text>
  <text x="60" y="230" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="15">
    <tspan x="60" dy="0">Son opciones de personalización especial como cuello polo</tspan>
    <tspan x="60" dy="24">o manga larga. Puedes agregar la cantidad exacta de prendas</tspan>
    <tspan x="60" dy="24">que llevarán estos detalles.</tspan>
    <tspan x="60" dy="28" fill="#94ec00" font-weight="600">Ejemplo: 2 camisetas con manga larga y 8 con manga corta.</tspan>
  </text>

  <rect x="40" y="400" width="520" height="320" rx="14" fill="#182234" stroke="#334155" stroke-width="2"/>
  <text x="300" y="440" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Asignación en la tabla de jugadores</text>

  <rect x="70" y="470" width="460" height="60" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="90" y="505" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Paso 1: Seleccionas 2 mangas largas</text>
  <text x="450" y="505" fill="#94ec00" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800">2 und</text>

  <rect x="70" y="545" width="460" height="60" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="90" y="580" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Paso 4: Asignas a 2 jugadores en la tabla</text>
  <text x="445" y="580" fill="#94ec00" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800">2/2 ✓</text>

  <text x="300" y="650" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle">
    <tspan x="300" dy="0">La tabla no te permitirá marcar más casillas que la cantidad</tspan>
    <tspan x="300" dy="22">comprada en el Paso 1, garantizando que tu pedido sea exacto.</tspan>
  </text>

  <text x="300" y="860" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">(Imagen de referencia reemplazable en assets/images/help-adicionales.svg)</text>
</svg>
